version: '3.8'

services:
  db:
    image: postgres
    environment:
      - POSTGRES_USER
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_DB},${POSTGRES_DB_TEST}
      - POSTGRES_PASSWORD
      - TZ=America/Los_Angeles
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB_TEST}
      - TZ=America/Los_Angeles
    env_file:
      - .env


  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    working_dir: /bot
    depends_on:
      - api
      - db
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_API_URL=${BACKEND_API_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      - TZ=America/Los_Angeles
    env_file:
      - .env


  test:
    profiles: ["test"]
    build:
      context: ./app
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB_TEST}
      - TZ=America/Los_Angeles
    env_file:
      - .env
    volumes:
      - "./app:/app"
      - "./logs/tests:/app/logs"
    command: pytest -v tests/

volumes:
  postgres_data: